name: Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Bind checked archives to the release plan and commit
        if: github.ref == 'refs/heads/main' && hashFiles('release/plan.json') != ''
        run: node scripts/release.mjs bundle
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && hashFiles('release/plan.json') != ''
        with:
          name: checked-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
  browser:
    name: browser (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm build
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: browser-${{ github.sha }}
          path: artifacts/browser/
          if-no-files-found: error
          retention-days: 30
