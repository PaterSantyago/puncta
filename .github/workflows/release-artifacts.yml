name: Authorize release artifacts
on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: release-artifacts-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  authorize:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify merged PR, exact checks and existing archive digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs attest '${{ github.event.workflow_run.id }}'
      - uses: actions/upload-artifact@v4
        if: hashFiles('verified-release/authorization.json') != ''
        with:
          name: release-${{ github.event.workflow_run.head_sha }}
          path: verified-release/
          if-no-files-found: error
          retention-days: 30
