name: Prepare release PR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: release-pr
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:prepare
      - name: Maintain one release PR and check its head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'No pending release'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B release/pending
          git add .changeset packages pnpm-lock.yaml pnpm-workspace.yaml release
          git commit -m 'chore: prepare independent alpha release'
          git push --force-with-lease origin release/pending
          pr=$(gh pr list --head release/pending --base main --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --base main --head release/pending --title 'chore: prepare independent alpha release' --body-file docs/release-pr.md
          fi
          gh workflow run check.yml --ref release/pending
